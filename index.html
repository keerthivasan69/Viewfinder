<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viewfinder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Viewfinder</title>
<style>
:root{--bg:#000;--fg:#f2f2f2;--mut:#8d8d92;--acc:#ffb300;--card:#1c1c1e;--card2:#151517;--line:#2a2a2c;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 14px) 14px calc(env(safe-area-inset-left) + 14px);display:flex;justify-content:space-between;gap:12px;font-size:13px;background:linear-gradient(#000a,#0000);pointer-events:none;z-index:2}
#hud b{color:var(--acc);font-size:17px;font-weight:600}
#hud .d{font-family:var(--mono);font-size:11.5px;color:#cfcfd4;margin-top:1px}
#hud .r{text-align:right}
#warn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 50px);max-width:80%;color:#111;background:var(--acc);padding:5px 12px;border-radius:999px;font-size:12.5px;display:none;z-index:2;text-align:center}
#strip{position:fixed;left:calc(env(safe-area-inset-left) + 10px);right:calc(env(safe-area-inset-right) + 96px);bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none;z-index:2}
#strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:50px;height:44px;padding:0 12px;border-radius:12px;border:1px solid #4448;background:#1c1c1ecc;font-family:var(--mono);font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
#strip input[type=range]{flex:1;min-width:140px;accent-color:var(--acc);height:44px}
#strip .zv{font-family:var(--mono);font-size:18px;min-width:78px;text-align:center;color:var(--acc);font-weight:700}
#side{position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(50% + 6px);transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;z-index:2}
.sb{width:58px;height:38px;border-radius:13px;border:1px solid #4448;background:#1c1c1ecc;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:0}
.sb:active{background:#555}
#shutter{width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:#fff3;padding:0}
#shutter:active{background:#fff}
@media (orientation:portrait){
  #side{top:auto;right:0;left:0;bottom:calc(env(safe-area-inset-bottom) + 62px);transform:none;flex-direction:row;justify-content:center;gap:12px}
  #strip{right:calc(env(safe-area-inset-right) + 10px)}
}
#start{position:fixed;inset:0;z-index:4;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#start button{background:var(--acc);color:#111;border:0;border-radius:14px;padding:14px 28px;font-weight:700;font-size:17px}
#err{color:#ff8a80;max-width:420px;font-size:14px}
#sheet{position:fixed;inset:0;background:#000;z-index:6;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-user-select:none}
#sheet.open{display:block}
#sheet.clear{background:transparent;pointer-events:none}
#sheet.clear .pg{pointer-events:auto}
.pg{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px)}
.ttl-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:2px 0 10px}
.ttl-row h1{margin:0;font-size:19px;font-weight:600}
.back{justify-self:start;background:none;border:0;color:var(--acc);font-size:18px;padding:6px 0}
.rc{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:0;border-radius:22px;padding:18px 20px;margin-bottom:12px}
.rc .ri{width:46px;text-align:center;color:var(--acc);font-size:30px}
.rc .rt{flex:1;min-width:0}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.rc .ttl{font-size:21px;font-weight:700;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .det{font-family:var(--mono);font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mut);font-size:30px}
.rcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcgrid .rc{margin:0}
@media (orientation:portrait){.rcgrid{grid-template-columns:1fr}}
.big{background:var(--card);border:0;border-radius:22px;color:var(--acc);font-weight:700;font-size:20px;padding:20px;width:100%;margin:12px 0}
.pill{display:block;margin:16px auto 0;background:var(--card);border:0;border-radius:999px;color:var(--acc);font-weight:600;font-size:20px;padding:16px 56px}
.pill.fill{background:var(--acc);color:#111;font-weight:700;border-radius:6px;padding:16px 72px}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--mut);margin:22px 4px 8px;text-transform:uppercase}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 18px;font-size:17px}
.li:last-child{border-bottom:0}
.li .s{display:block;font-family:var(--mono);font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx{min-width:0;flex:1}
.li.on{background:#3a2d12;color:var(--acc)}
.li .x{color:var(--mut);font-size:24px;padding:0 8px}
.tag{display:inline-block;background:#3a2d12;color:var(--acc);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:12.5px;font-weight:700;margin-left:6px}
.cnt{color:var(--mut);font-family:var(--mono);font-size:13px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid #555;flex:0 0 auto}
.ck.on{background:var(--acc);border-color:var(--acc);position:relative}
.ck.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:15px}
.search{flex:1;min-width:0;background:var(--card2);border:0;border-radius:8px;padding:11px 14px;font-size:17px;-webkit-user-select:text;user-select:text}
.srow{display:flex;gap:10px;margin-bottom:12px}
.hbtn{justify-self:end;background:none;border:0;color:var(--acc);font-size:18px;font-weight:600;padding:6px 0}
.cols{display:grid;gap:14px;align-items:start}
.cols.c3{grid-template-columns:.9fr 1.1fr 1.2fr}
.cols.c2{grid-template-columns:.8fr 2fr}
.colbox{max-height:calc(100vh - 170px);min-height:150px;overflow-y:auto;background:var(--card2);border-radius:8px}
.colbox .li{padding:12px 16px}
.hdrs{display:grid;gap:14px;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px 26px;font-family:var(--mono);font-size:19px;margin:6px 0 14px}
.opt{background:none;border:0;color:#6d6d72;font-family:var(--mono);font-size:19px;padding:6px 0}
.opt.on{color:var(--acc)}
.frow{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;font-family:var(--mono);font-size:19px;margin:10px 0}
.grp3{display:flex;align-items:center;gap:12px}
.grp3 .l{color:#a0a0a5}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row label{color:var(--mut);flex:0 0 42%;font-size:15px}
.row input[type=number],.row input[type=text],.row select,.row textarea{flex:1;min-width:0;background:#222;border:1px solid #3a3a3a;border-radius:8px;padding:9px;-webkit-user-select:text;user-select:text}
.mut{color:var(--mut);font-size:13px;line-height:1.4}
.panel{position:fixed;left:0;right:0;bottom:0;background:#151517f2;border-radius:20px 20px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 14px);max-height:50vh;overflow:auto;pointer-events:auto}
@media (orientation:landscape){.panel{top:0;left:auto;width:min(48vw,460px);max-height:none;border-radius:20px 0 0 20px;padding-top:calc(env(safe-area-inset-top) + 12px);padding-right:calc(env(safe-area-inset-right) + 16px)}}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btn{background:#2a2a2d;border:1px solid #444;border-radius:12px;min-height:44px;padding:0 18px}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gc{background:var(--card);border-radius:14px;overflow:hidden}
.gc img{width:100%;display:block;background:#000}
.gc .t{padding:8px 10px;font-size:12px;color:#c9c9ce}
.gc .t .n{color:var(--fg);margin-top:4px;font-size:14px}
.gc .a{display:flex;gap:6px;padding:0 10px 10px}
.gc .a button{flex:1;background:#2a2a2d;border:1px solid #444;border-radius:8px;padding:8px 4px}
.hide{display:none!important}
body.cal #side,body.cal #strip,body.cal #hud,body.cal #warn{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<video id="v" playsinline muted autoplay></video>

<div id="hud"><div id="hl"></div><div class="r" id="hr"></div></div>
<div id="warn"></div>
<div id="strip"></div>
<div id="side">
  <button class="sb" id="bRig">Rig</button>
  <button class="sb" id="bFl">Lines</button>
  <button id="shutter" aria-label="Capture frame"></button>
  <button class="sb" id="bGal">Frames</button>
  <button class="sb" id="bSet">Setup</button>
</div>

<div id="start">
  <h1 style="margin:0;font-size:28px">Viewfinder</h1>
  <p class="mut" style="max-width:400px;margin:0">Pick a camera sensor, a lens and an adapter. The preview zooms to match the lens on that sensor. Landscape works best.</p>
  <button id="bStart">Start camera</button>
  <div id="err"></div>
</div>

<div id="sheet"><div id="pgwrap"></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const D2R = Math.PI / 180;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return e;
}

/* =====================  DATA  ===================== */
const M = (n, w, h, res) => ({n, w, h, res: res || ''});
const CAMERAS = [
  {make:'ARRI', model:'ALEXA 35', modes:[M('4.6K 3:2 Open Gate',27.99,19.22,'4608×3164'), M('4K 16:9',24.88,14.00,'4096×2304'), M('4K 2.39:1',24.88,10.42,'4096×1716')]},
  {make:'ARRI', model:'ALEXA LF', modes:[M('LF Open Gate 3:2',36.70,25.54,'4448×3096'), M('LF 16:9 3.8K',31.68,17.82,'3840×2160'), M('LF 2.39:1',36.70,15.31,'4448×1856')]},
  {make:'ARRI', model:'ALEXA Mini LF', modes:[M('LF Open Gate 3:2',36.70,25.54,'4448×3096'), M('LF 16:9 3.8K',31.68,17.82,'3840×2160'), M('LF 2.39:1',36.70,15.31,'4448×1856')]},
  {make:'ARRI', model:'ALEXA Mini', modes:[M('Open Gate 3.4K',28.25,18.17,'3424×2202'), M('16:9 UHD',26.40,14.85,'3200×1800'), M('16:9 2.8K',23.76,13.37,'2880×1620')]},
  {make:'ARRI', model:'ALEXA 65', modes:[M('Open Gate 6.5K',54.12,25.58,'6560×3100')]},
  {make:'ARRI', model:'416', modes:[M('Super 16',12.52,7.41)]},
  {make:'RED', model:'V-RAPTOR', modes:[M('8K VV 17:9',40.96,21.60,'8192×4320'), M('6K S35 17:9',30.72,16.20,'6144×3240')]},
  {make:'RED', model:'KOMODO', modes:[M('6K S35 17:9',27.03,14.26,'6144×3240')]},
  {make:'RED', model:'MONSTRO 8K VV', modes:[M('8K VV 17:9',40.96,21.60,'8192×4320')]},

  {make:'Sony', model:'FX3 / FX6 / A7S III', modes:[M('4K 16:9 full frame',35.6,20.0,'3840×2160')]},
  {make:'Sony', model:'FX9', modes:[M('6K 3:2 full frame',35.7,23.8)]},
  {make:'Canon', model:'C70 / C300 III', modes:[M('4K 17:9 Super 35',26.2,13.8,'4096×2160')]},
  {make:'Canon', model:'C500 Mark II', modes:[M('5.9K 17:9 full frame',38.1,20.1,'5952×3140')]},
  {make:'Blackmagic', model:'Pocket Cinema 6K', modes:[M('6K 17:9',23.10,12.99,'6144×3456')]},
  {make:'Blackmagic', model:'Pocket Cinema 4K', modes:[M('4K 17:9',18.96,10.00,'4096×2160')]},
  {make:'Blackmagic', model:'URSA Mini Pro 12K', modes:[M('12K 17:9',27.03,14.25,'12288×6480')]},
  {make:'Panasonic', model:'LUMIX S1H', modes:[M('6K 3:2 full frame',35.6,23.8)]},
  {make:'Film', model:'35mm', modes:[M('Full aperture (4-perf)',24.89,18.66), M('Academy',22.0,16.0)]},
  {make:'Film', model:'16mm', modes:[M('Super 16',12.52,7.41), M('Regular 16',10.26,7.49)]},
  {make:'Film', model:'65mm / IMAX', modes:[M('65mm 5-perf',52.48,23.01), M('IMAX 15/70',70.41,52.63)]},
  {make:'Generic', model:'Full frame', modes:[M('36 × 24 (3:2)',36,24), M('36 × 20.25 (16:9)',36,20.25)]},
  {make:'Generic', model:'APS-C', modes:[M('23.6 × 15.7 (3:2)',23.6,15.7)]},
  {make:'Generic', model:'Micro Four Thirds', modes:[M('17.3 × 13 (4:3)',17.3,13), M('17.3 × 9.73 (16:9)',17.3,9.73)]},
  {make:'Generic', model:'1-inch', modes:[M('13.2 × 8.8 (3:2)',13.2,8.8)]}
];
const P = (make, name, t, cov, f, x) => Object.assign({make, name, t, cov, f, zoom:null, sq:1}, x || {});
const Z = (make, name, t, cov, lo, hi, x) => Object.assign({make, name, t, cov, f:null, zoom:[lo,hi], sq:1}, x || {});
const LENSES = [
  P('ARRI','Signature Prime','T1.8','LF',[12,15,18,21,25,29,35,40,47,58,75,95,125,150,200,280]),
  P('ARRI','Enso Prime','T2.1','LF',[10.5,14,18,21,24,28,32,40,50,65,85,100,135],{approx:1}),
  P('ARRI','Master Prime','T1.3','S35',[12,14,16,18,21,25,27,32,35,40,50,65,75,100,135,150]),
  Z('ARRI','Ultra Wide Zoom','T2.9','S35',9.5,18),
  Z('ARRI','Anamorphic Ultra Wide Zoom','T4.2','S35',19,36,{sq:2}),
  Z('ARRI','Alura Zoom 15.5–45','T2.8','S35',15.5,45),
  Z('ARRI','Alura Zoom 45–250','T2.6','S35',45,250),
  P('Zeiss','Supreme Prime','T1.5','FF',[15,18,21,25,29,35,40,50,65,85,100,135,150,200]),
  P('Zeiss','CP.3','T2.1','FF',[15,18,21,25,28,35,50,85,100,135]),
  P('Cooke','S4/i','T2','S35',[12,14,16,18,21,25,27,32,35,40,50,65,75,100,135,150]),
  P('Cooke','S7/i','T2','FF',[16,18,21,25,27,32,40,50,65,75,100,135,180,300]),
  P('Cooke','Panchro/i Classic','T2.2','S35',[18,25,32,40,50,65,75,100,135]),
  P('Cooke','Anamorphic/i','T2.3','S35',[25,32,40,50,65,75,100,135,180,300],{sq:2}),
  P('Canon','CN-E Prime','T1.5','S35',[14,20,24,35,50,85,135],{approx:1}),
  P('Canon','Sumire Prime','T1.3','FF',[14,20,24,35,50,85,135],{approx:1}),
  P('Sigma','Cine FF High Speed','T1.5','FF',[14,20,24,28,35,40,50,65,85,105,135],{approx:1}),
  P('Leica','Summilux-C','T1.4','S35',[16,18,21,25,29,35,40,50,65,75,100,135],{approx:1}),
  P('Atlas','Orion Anamorphic','T2','S35',[21,25,32,40,50,65,80,100,135],{sq:2,approx:1}),
  Z('Angénieux','Optimo 15–40','T2.6','S35',15,40),
  Z('Angénieux','Optimo 28–76','T2.6','S35',28,76),
  Z('Angénieux','Optimo 45–120','T2.8','S35',45,120),
  Z('Angénieux','Optimo 24–290','T2.8','S35',24,290),
  Z('Angénieux','EZ-1 30–90','T2','S35',30,90),
  Z('Angénieux','EZ-2 15–40','T2','S35',15,40),
  P('Generic','Prime set','T2','FF',[14,16,18,21,24,25,28,32,35,40,50,65,75,85,100,135,150,200]),
  P('Generic','Anamorphic 2× set','T2.8','S35',[25,35,40,50,75,100],{sq:2}),
  Z('Generic','Zoom 24–70','T2.8','FF',24,70),
  Z('Generic','Zoom 70–200','T2.8','FF',70,200)
];
LENSES.forEach(l => l.id = (l.make + '-' + l.name).toLowerCase().replace(/[^a-z0-9]+/g, '-'));
const ADAPTERS = [
  {n:'None', f:1, d:'Nothing between the lens and the body'},
  {n:'Speed Booster 0.50×', f:0.50}, {n:'Speed Booster 0.58×', f:0.58},
  {n:'Speed Booster XL 0.64×', f:0.64}, {n:'Speed Booster Ultra 0.71×', f:0.71},
  {n:'Teleconverter 1.4×', f:1.4}, {n:'Teleconverter 2×', f:2}
];
const adStops = a => -2 * Math.log2(a.f);
const FLS = [{n:'Off', a:0}, {n:'2.39:1', a:2.39}, {n:'2.00:1', a:2}, {n:'1.85:1', a:1.85}, {n:'16:9', a:16/9}, {n:'1.66:1', a:1.66},
             {n:'4:3', a:4/3}, {n:'1:1', a:1}, {n:'4:5', a:0.8}, {n:'9:16', a:9/16}];

/* =====================  STATE  ===================== */
const DEF = {camMake:'ARRI', camModel:'ALEXA LF', modeIdx:0, lensId:'arri-signature-prime', focal:35, adapter:0,
  fl:0, flc:0, center:true, thirds:false, horizon:false, safe:0, mask:0.85, line:1,
  auto:true, res:'std', calib:{}};
let S = Object.assign({}, DEF, store.get('vf2', {}));
let customCams = store.get('vf2cams', []);
let customLens = store.get('vf2lens', []);
let savedRigs = store.get('vf2rigs', []);
let recents = store.get('vf2recent', []);
const saveS = () => store.set('vf2', S);

const allCams = () => CAMERAS.concat(customCams);
const allLens = () => LENSES.concat(customLens);
function rig() {
  const cams = allCams();
  const cam = cams.find(c => c.make === S.camMake && c.model === S.camModel) || cams[1];
  const mode = cam.modes[clamp(S.modeIdx | 0, 0, cam.modes.length - 1)];
  const lens = allLens().find(l => l.id === S.lensId) || LENSES[0];
  const ad = ADAPTERS[clamp(S.adapter | 0, 0, ADAPTERS.length - 1)];
  let f = +S.focal;
  if (lens.zoom) f = clamp(f, lens.zoom[0], lens.zoom[1]);
  else if (!lens.f.includes(f)) f = lens.f.reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a);
  return {cam, mode, lens, ad, f, sq: lens.sq || 1};
}

function lensPage() {
  let q = '', mk = allLens().find(l => l.id === S.lensId) ? allLens().find(l => l.id === S.lensId).make : 'ARRI';
  const root = h('div', {class:'pg'}), cols = h('div', {class:'cols c2'});

    if (!makes.includes(mk)) mk = makes[0];
    const sets = all.filter(l => l.make === mk && match(l));
    const col = (title, items) => h('div', null, h('div', {class:'lab', style:'margin:0 4px 6px', text:title}), h('div', {class:'colbox'}, h('div', {class:'list', style:'border-radius:0;background:none'}, items)));

          h('span', {class:'tx'}, l.name, l.sq !== 1 ? h('span', {class:'tag', text:l.sq + 'x'}) : null, h('span', {class:'s', text:det + (l.approx ? ' (list approximate)' : '')})), h('span', {class:'chev', text:'›'}));

      else { const arr = fs.split(/[ ,]+/).map(parseFloat).filter(v => v > 0).sort((a, b) => a - b); if (!arr.length) return; l = P('Custom', nm, '', '', arr, {sq}); }
      l.id = 'custom-' + Date.now(); customLens.push(l); store.set('vf2lens', customLens); S.lensId = l.id; S.focal = l.zoom ? l.zoom[0] : l.f[0]; saveS(); renderStrip(); openPage(rigPage); }}})), cols,
    h('p', {class:'mut', style:'text-align:center', text:'Focal lengths are from public spec sheets and may not list every lens. Check against your own set, or add a custom lens set.'}));

}

function framesPage() {

function calibPage() {
  calibMode = true;
  const root = h('div', {class:'pg', style:'padding:0'});
  const ac = activeCam();
  const out = h('div', {class:'mono', style:'font-size:15px;color:var(--acc)'});

  root.append(h('div', {class:'panel'},
    h('div', {class:'lab', text:'Calibrate phone camera'}), h('p', {class:'mut', style:'margin:6px 0', text:'Point the phone straight at a flat wall. The amber lines mark the left and right edge of the view. Measure the distance from the phone to the wall, and the width of wall between the two edges.'}),
    cams.length > 1 ? h('div', {class:'row'}, h('label', {text:'Phone camera'}), sel) : null,
    h('div', {class:'row'}, h('label', {text:'Distance to wall (m)'}), dist),

    out,

      h('button', {class:'btn', text:'Apply', on:{click:() => {
        let v = parseFloat(hf.value); const d = parseFloat(dist.value), w = parseFloat(wid.value);
        if (d > 0 && w > 0) v = 2 * Math.atan(w / 2 / d) / D2R;

      h('button', {class:'btn pri', text:'Done', on:{click:() => { calibMode = false; lastHud = ''; openPage(setupPage); }}}))));

let galUrls = [];
function galleryPage() {
  const root = h('div', {class:'pg'}), box = h('div', {id:'gal'});
  root.append(h('div', {class:'ttl-row'}, h('button', {class:'back', text:'‹ Close', on:{click:closeSheet}}), h('h1', {text:'Saved frames'}), h('button', {class:'btn', style:'justify-self:end', text:'Export CSV', on:{click:exportCsv}})), box);

    for (const r of list) {

        h('div', {class:'t'}, new Date(r.ts).toLocaleString() + ' · ' + metaStr(r), h('div', {class:'n', text:r.note || ''})),
        h('div', {class:'a'},
          h('button', {text:'Save / share', on:{click:() => shareOrSave(r)}}),
          h('button', {text:'Note', on:{click:async () => { const v = prompt('Note for this frame', r.note || ''); if (v === null) return; r.note = v.trim(); await tx('readwrite', s => s.put(r)); openPage(galleryPage); }}}),
          h('button', {text:'Delete', on:{click:async () => { if (!confirm('Delete this frame?')) return; await tx('readwrite', s => s.delete(r.id)); openPage(galleryPage); }}}))));

}
async function exportCsv() {
  const list = (await tx('readonly', s => s.getAll())) || [];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['time','file','camera','sensor_mode','lens','focal_mm','effective_mm','t_stop','squeeze','adapter','frameline','hfov_deg','vfov_deg','note'].join(',')];
  list.forEach(r => rows.push([new Date(r.ts).toISOString(), fname(r), r.cam, r.mode, r.lens, r.focal, r.eff, r.t, r.squeeze, r.adapter, r.aspect, r.hfov, r.vfov, r.note].map(q).join(',')));
  download(new Blob([rows.join('\n')], {type:'text/csv'}), 'viewfinder_frames.csv');
}

/* =====================  LENS STRIP  ===================== */
function renderStrip() {
  const r = rig(), strip = $('#strip'); strip.replaceChildren();
  if (r.lens.zoom) {
    const [lo, hi] = r.lens.zoom, step = (hi - lo) > 60 ? 1 : 0.5;
    const val = h('span', {class:'zv', text:fmtF(r.f) + 'mm'});
    const set = v => { S.focal = clamp(Math.round(v / step) * step, lo, hi); saveS(); val.textContent = fmtF(S.focal) + 'mm'; sl.value = S.focal; };
    const sl = h('input', {type:'range', min:lo, max:hi, step, value:r.f, on:{input:e => set(+e.target.value)}});
    strip.append(h('button', {class:'chip', text:'−', on:{click:() => set(S.focal - step)}}), sl, h('button', {class:'chip', text:'+', on:{click:() => set(S.focal + step)}}), val);
  } else {
    r.lens.f.forEach(f => strip.append(h('button', {class:'chip' + (f === r.f ? ' on' : ''), 'data-f':f, text:fmtF(f), on:{click:() => { S.focal = f; saveS(); renderStrip(); }}})));
    const on = strip.querySelector('.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
  }
  lastHud = '';
}
